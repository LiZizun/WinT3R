# @package _global_

model:
    _target_: dust3r.wint3r.WinT3R
    pretrain_ckpts: null # <path-to-your-pretrain-checkpoint>
    ckpts: null # <path-to-your-pretrain-checkpoint>
    state_size: 1024
    state_pe: "2d"
    pos_embed: "RoPE100"
    patch_embed_cls: "ManyAR_PatchEmbed"
    img_size: [512, 512]
    head_type: "conv"
    enc_embed_dim: 1024
    enc_depth: 24
    enc_num_heads: 16
    dec_embed_dim: 768
    dec_depth: 12
    dec_num_heads: 12
    landscape_only: False
    window_size: 4

loss:
    train_loss: 
        _target_: loss.loss.ConfLoss
        alpha: 0.2
        pixel_loss:
            _target_: loss.loss.Regr3DPose
            norm_mode: "?avg_dis"
            sky_loss_value: -1

    test_loss:
        _target_: loss.loss.ConfLoss
        alpha: 0.2
        pixel_loss:
            _target_: loss.loss.Regr3DPose
            norm_mode: "?avg_dis"
            sky_loss_value: -1

train:
    num_workers: 16
    batch_size: 1              # not use, dynamic batch size
    num_epoch: 80
    iters_per_epoch: 800

    print_freq: 40
    base_seed: 666

    model_dtype: bf16
    # dynamic complie
    dynamo_backend: NO  # CUDAGRAPHS  # INDUCTOR  # NO
    dynamic_compile: true

    # Training config
    gradient_accumulation_steps: 1
    clip_grad: 1.0
    clip_loss: 10
    
    seed: 42
    resume: null
    auto_resume: true
    start_epoch: 0
    global_step: 0
    world_size: 1
    rank: -1
    gpu: -1
    dist_on_itp: false
    find_unused_parameters: false

    # for distributed training
    distributed: false
    dist_url: env://
    dist_backend: "nccl"

    # Optimizer config
    optimizer:
        type: AdamW
        lr: 5e-5
        weight_decay: 5e-2
        betas: [0.9, 0.95]
        verbose: true
        filter_bias_and_bn: true

        encoder_lr: 5e-6

    lr_scheduler:
        type: OneCycleLR
        max_lr: ${train.optimizer.lr}
        pct_start: 0.0
        anneal_strategy: cos
        div_factor: 1000.0
        final_div_factor: 100.0
        total_steps: -1

test:
    num_workers: 16              # 16
    batch_size: 1              # not use, dynamic batch size
    print_freq: 10
    iters_per_test: -1