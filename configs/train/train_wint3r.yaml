# @package _global_

trainer: trainers.trainer.Trainer

train:
  # image_num_range: [2, 24]     # hres
  # max_img_per_gpu: 24             # hres

  # dynamic resolution and 
  random_reslution: true
  aspect_ratio_range: [0.5, 2.0]
  pixel_count_range: [100000, 200000] 
  patch_size: 16
  num_resolution: 10
  num_epoch: 20

model:
  ckpts: null # <path-to-your-checkpoint>

loss:
  train_loss:
    _target_: loss.loss.ConfLoss
    alpha: 0.2
    pixel_loss:
      _target_: loss.loss.Regr3DPose
      norm_mode: "?avg_dis"
      sky_loss_value: -1

  test_loss:
    _target_: loss.loss.ConfLoss
    alpha: 0.2
    pixel_loss:
      _target_: loss.loss.Regr3DPose
      norm_mode: "?avg_dis"
      sky_loss_value: -1